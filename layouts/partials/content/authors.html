<div class="authors">
    <strong>Autorzy:</strong>
    {{ range $index, $author := .Params.authors }}
        {{ if $index }}<span>,</span>{{ end }}
        {{ $url := printf "/authors/%s" ($author | urlize) }}
        <a href="{{ $url | relURL }}">{{ $author }}</a>
    {{ else }}
        <span>{{ site.Params.Author.name }}</span>
    {{ end }}
    <span class="mx-2">•</span>
    {{ .ReadingTime }} min czytania
</div>
