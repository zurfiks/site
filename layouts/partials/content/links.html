{{ if .Params.links }}
<div class="links">
    <h4>Czytelnia uzupełniająca i powiązania:</h4>
    <ul>
        {{ range .Params.links }}
        <li>
            <a href="{{ .link | relURL }}"><strong>{{ .anchor }}</strong></a><br>
            <small><i>{{ .visible_link }}</i></small>
        </li>
        {{ end }}
    </ul>
</div>
{{ end }}
