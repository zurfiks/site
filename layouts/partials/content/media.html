<div class="media-content">
  {{ if eq .Params.type "youtube" }}
    {{ if .Params.youtube_id }}
    <figure>
        <iframe width="100%" height="450" src="https://www.youtube.com/embed/{{ .Params.youtube_id }}" frameborder="0" allowfullscreen></iframe>
    </figure>
    {{ end }}
  {{ else if eq .Params.type "soundcloud" }}
    {{ if .Params.soundcloud_url }}
    <figure>
        <iframe width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url={{ .Params.soundcloud_url | urlquery }}&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true"></iframe>
    </figure>
    {{ end }}
  {{ end }}
</div>
