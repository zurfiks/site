<div class="media-content my-8">
  {{ if eq .Params.type "youtube" }}
    {{ if .Params.youtube_id }}
      <div class="aspect-video w-full rounded-2xl overflow-hidden shadow-lg border">
        <iframe class="w-full h-full" src="https://www.youtube.com/embed/{{ .Params.youtube_id }}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
    {{ end }}
  {{ else if eq .Params.type "soundcloud" }}
    {{ if .Params.soundcloud_url }}
      <div class="soundcloud-embed w-full rounded-2xl overflow-hidden shadow-md border p-4 bg-zinc-50">
        <iframe width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url={{ .Params.soundcloud_url | urlquery }}&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true"></iframe>
      </div>
    {{ end }}
  {{ end }}
</div>
